<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belfry · 协作收件箱原型</title>
<link rel="icon" href="assets/belfry.png"><link rel="stylesheet" href="inbox.css">
</head>
<body>
<!-- 只读原型：会话列表 → 消息详情。全部数据为示例；不调用 Belfry API，不投递任何消息。
     合并、调度、发送由 Agent 与后台完成，界面只呈现结果（字段对照 T60 api-ui.md）。
     演示控制在地址后加 #demo 才出现，或由 tools/verify.mjs 驱动。 -->
<div class="app" id="app">
  <aside class="list-pane" aria-label="会话">
    <header class="list-head">
      <div class="title-row"><h1>收件箱</h1><span class="sample-tag" title="本页所有会话与消息都是示例">示例数据</span><button class="icon-button" id="theme" data-action="theme" aria-label="切换浅色"></button></div>
      <div class="filters" role="tablist" aria-label="筛选会话" id="filters"></div>
    </header>
    <div class="session-list" id="session-list"></div>
  </aside>
  <main class="detail-pane" id="detail" aria-label="消息详情"></main>
</div>
<div class="demo-panel" id="demo-panel" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="icons.js"></script><script src="inbox.js"></script>
</body></html>
