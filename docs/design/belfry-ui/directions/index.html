<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Belfry · 视觉方向对比（T3）</title>
<style>
  body{margin:0;background:#101111;color:#e8e8e3;font:14px/1.5 -apple-system,"HarmonyOS Sans SC",sans-serif}
  header{padding:28px 32px 8px}
  h1{font-size:18px;font-weight:500;margin:0 0 4px}
  p{margin:0;color:#9a9b95}
  nav{display:flex;gap:8px;padding:16px 32px}
  nav button{font:inherit;color:#c9c9c3;background:#1c1d1c;border:1px solid #2c2d2b;border-radius:6px;padding:6px 12px;cursor:pointer}
  nav button[aria-pressed=true]{background:#e8e8e3;color:#101111;border-color:#e8e8e3}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 32px 32px}
  figure{margin:0}
  figcaption{font-size:12px;color:#8a8b85;margin-bottom:8px}
  iframe{width:100%;aspect-ratio:16/10;border:1px solid #2c2d2b;border-radius:8px;background:#000}
</style>
</head>
<body>
<header>
  <h1>Belfry 主工作台 · 三个视觉方向</h1>
  <p>每个方向左暗右亮，结构完全相同，只换令牌与形态规则。说明见 README.md。全部为演示数据。</p>
</header>
<nav id="nav">
  <button data-d="a" aria-pressed="true">A 石墨 Graphite+</button>
  <button data-d="b" aria-pressed="false">B 曜石 Obsidian（推荐）</button>
  <button data-d="c" aria-pressed="false">C 纸墨 Ink</button>
</nav>
<div class="pair">
  <figure><figcaption>暗色</figcaption><iframe id="dark" title="暗色"></iframe></figure>
  <figure><figcaption>亮色</figcaption><iframe id="light" title="亮色"></iframe></figure>
</div>
<script>
  const show = d => {
    dark.src = `workbench.html?dir=${d}&theme=dark`;
    light.src = `workbench.html?dir=${d}&theme=light`;
    for (const b of nav.children) b.setAttribute("aria-pressed", b.dataset.d === d);
  };
  nav.onclick = e => e.target.dataset.d && show(e.target.dataset.d);
  show("a");
</script>
</body>
</html>
