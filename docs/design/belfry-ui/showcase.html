<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belfry · 全局 UI 设计对比</title><link rel="icon" href="assets/belfry.png"><style>
@font-face{font-family:Harmony;src:url('../../../public/fonts/HarmonyOSSansSC-Regular.woff2')}@font-face{font-family:Harmony;src:url('../../../public/fonts/HarmonyOSSansSC-Medium.woff2');font-weight:500}
*{box-sizing:border-box}body{margin:0;background:#171b19;color:#edf0eb;font:14px/1.65 Harmony,sans-serif;font-synthesis:none}header,main{max-width:1488px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid #38413b;flex-wrap:wrap}h1{font-size:24px;font-weight:500;margin:0}p{color:#a7b1aa;margin:4px 0 0}.brand{display:flex;align-items:center;gap:12px}.brand img{width:36px;height:36px}a,button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 16px;text-decoration:none;border:1px solid #38413b;color:#edf0eb;background:none}a.primary{color:#18271c;background:#b2d5b6;border-color:#b2d5b6}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button[aria-pressed=true]{color:#b2d5b6;background:#314b38}button:focus-visible,a:focus-visible{outline:2px solid #c0e9c8;outline-offset:3px}figure{margin:0}figure img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid #38413b}figcaption{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px;color:#a7b1aa;font-size:13px}.notes{margin-top:28px;border-top:1px solid #38413b;padding-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}h2{font-size:16px;font-weight:500;margin:0 0 6px}.notes p{font-size:14px}footer{padding-top:24px;color:#a7b1aa;font-size:12px}button:hover{background:#2c322f}@media(max-width:700px){header,main{padding:20px}.notes{grid-template-columns:1fr}h1{font-size:20px}}
</style></head><body><header><div class="brand"><img src="assets/belfry.png" alt=""><div><h1>Belfry · 全局 UI 重设计</h1><p>终端优先 / 安静的轨道 / 明确的状态</p></div></div><a class="primary" href="index.html">打开可交互原型 →</a></header><main><nav aria-label="设计方案"><button data-variant="graphite" aria-pressed="true">Graphite · 主方案</button><button data-variant="paper" aria-pressed="false">Paper · 暖白</button><button data-variant="compact" aria-pressed="false">Compact · 紧凑</button></nav><figure><img id="preview" src="previews/graphite.png" alt="Graphite 主方案工作台桌面截图"><figcaption><span id="caption">石墨表面 + 低饱和绿色动作，保留终端为中心。</span><span>独立 Chrome 实际渲染 · 1440 × 960 · 合成演示数据</span></figcaption></figure><section class="notes"><div><h2>导航不抢工作内容</h2><p>项目、会话、工具三段分组；待确认内容从终端输出中抽出，保留清晰返回路径。</p></div><div><h2>全局一致，而非全部卡片化</h2><p>8 个主页面、11 个设置子页，共用排版、表单、弹窗、焦点和状态语法。</p></div><div><h2>保护已有行为</h2><p>凭据动作、敏感预览确认、未保存提示可体验。此处不启动终端、不改真实配置。</p></div></section><footer>当前交付为设计原型与截图，不是已接入生产 React/Tauri 的改版。第三方插件内部页面不在换肤范围内。</footer></main><script>
const copy={graphite:'石墨表面 + 低饱和绿色动作，保留终端为中心。',paper:'暖白平面 + 编辑式间距，适合白天阅读与设置操作。',compact:'更窄的导航与紧凑外壳，正文保持可读，适合多会话工作。'};
document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>{const variant=button.dataset.variant;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#preview').src=`previews/${variant}.png`;document.querySelector('#preview').alt=`${variant} 工作台桌面截图`;document.querySelector('#caption').textContent=copy[variant];}));
</script></body></html>
