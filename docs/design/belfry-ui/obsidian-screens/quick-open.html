<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>曜石 · Quick Open</title>
<script src="boot.js"></script>
<link rel="stylesheet" href="obsidian.css">
<style>
  .qo{width:640px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
  .qo-search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--border)}
  .qo-search svg{color:var(--text-faint)}
  .qo-search input{flex:1;border:0;outline:0;background:transparent;font-size:var(--fs-lg);color:var(--text)}
  .qo-scope{display:flex;gap:6px;padding:10px 12px 6px}
  .qo-scope .tag{height:24px;padding:0 8px;font-size:12px;cursor:pointer}
  .qo-list{padding:4px 6px 6px;max-height:420px;overflow:auto}
  .qo-group{padding:10px 10px 4px;font-size:var(--fs-xs);color:var(--text-faint);font-weight:500}
  .qo-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 10px;border-radius:var(--radius-sm)}
  .qo-item:hover,.qo-item.is-hover{background:var(--surface-hover)}
  .qo-item.is-active{background:var(--accent-soft)}
  .qo-item.is-active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
  .qo-icon{width:28px;height:28px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--surface);color:var(--text-muted);box-shadow:inset 0 0 0 1px var(--border)}
  .qo-item.is-active .qo-icon{color:var(--accent);background:var(--canvas)}
  .qo-copy{flex:1;min-width:0;display:flex;flex-direction:column}
  .qo-copy b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qo-item.is-active .qo-copy b{font-weight:500}
  .qo-copy span{font-size:var(--fs-xs);color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qo-item.is-active .qo-copy span{color:var(--text-muted)}
  .qo-copy mark{background:none;color:var(--accent);font-weight:500}
  .qo-kind{font-size:var(--fs-xs);color:var(--text-faint)}
  .qo-foot{display:flex;align-items:center;gap:16px;height:36px;padding:0 14px;border-top:1px solid var(--border);background:var(--panel);font-size:var(--fs-xs);color:var(--text-faint)}
  .qo-foot span{display:inline-flex;align-items:center;gap:6px}
  .qo-foot .grow{flex:1}
  .ghost-term{padding:28px 24px;font:400 13.5px/1.65 var(--font-mono);color:var(--text-faint);white-space:pre}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div></aside>
  <main class="face"><pre class="ghost-term">✳ Welcome to Claude Code

&gt; 帮我把设置页的视觉层级收敛一下。

● 先读 SettingsPanel 的结构，再统一分区外壳规格。</pre></main>
</div>

<div class="scrim top">
  <div class="qo s-left" role="dialog" aria-label="Quick Open" data-s="panel 640 · r12 · raised · shadow-lg">
    <div class="qo-search" data-s="search 52 · fs15 · border-bottom">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input value="sett" aria-label="搜索">
      <kbd>esc</kbd>
    </div>
    <div class="qo-scope" data-s="scope chips 24 · accent-soft=当前范围">
      <span class="tag accent">全部</span><span class="tag">会话</span><span class="tag">项目</span><span class="tag">设置</span><span class="tag">命令</span>
    </div>
    <div class="qo-list">
      <div class="qo-group">会话</div>
      <button class="qo-item is-active" data-s="候选 44 · accent-soft + 2px accent（A13）">
        <span class="qo-icon"><svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12M3.8 3.8l8.4 8.4M12.2 3.8l-8.4 8.4"/></svg></span>
        <span class="qo-copy"><b>重构<mark>设置</mark>页视觉</b><span class="mono">belfry-win · Claude Code · 运行中</span></span>
        <span class="dot ok" aria-label="运行中"></span>
        <kbd>↵</kbd>
      </button>
      <button class="qo-item is-hover" data-s="hover: surface-hover，不加侧标">
        <span class="qo-icon"><svg viewBox="0 0 16 16"><path d="M3 5l3 3-3 3M8 11h5"/></svg></span>
        <span class="qo-copy"><b>tester</b><span class="mono">belfry-win · Codex · <mark>sett</mark>le flaky tests</span></span>
        <span class="tag warn">待确认</span>
      </button>
      <div class="qo-group">设置</div>
      <button class="qo-item">
        <span class="qo-icon"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="6" cy="7" r="1.3"/><path d="M14 11l-3.5-3.5L4 13"/></svg></span>
        <span class="qo-copy"><b><mark>设置</mark> › 外观</b><span>主题、字体、工作区背景</span></span>
        <span class="qo-kind">设置</span>
      </button>
      <button class="qo-item">
        <span class="qo-icon"><svg viewBox="0 0 16 16"><path d="M2 8h3l2-4 2 8 2-4h3"/></svg></span>
        <span class="qo-copy"><b><mark>设置</mark> › 全局 Provider</b><span>Claude Code / Codex / Pi 的服务与密钥</span></span>
        <span class="qo-kind">设置</span>
      </button>
      <div class="qo-group">命令</div>
      <button class="qo-item">
        <span class="qo-icon"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M8 3v10"/></svg></span>
        <span class="qo-copy"><b>拆分终端</b><span>在右侧打开同项目的新 Shell</span></span>
        <kbd>⌘D</kbd>
      </button>
    </div>
    <div class="qo-foot s-below" data-s="foot 36 · panel · fs12 faint">
      <span><kbd>↑</kbd><kbd>↓</kbd>选择</span>
      <span><kbd>↵</kbd>打开</span>
      <span><kbd>⌘</kbd><kbd>↵</kbd>在新窗格打开</span>
      <span class="grow"></span>
      <span>5 个结果</span>
    </div>
  </div>
</div>
<div class="demo">演示数据 · 设计稿</div>
</body>
</html>
