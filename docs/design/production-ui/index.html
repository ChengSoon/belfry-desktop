<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belfry · 生产 UI 验证截图</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#191c1b;color:#edf0eb;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1440px;margin:auto}h1{font-size:24px;font-weight:500;margin:0 0 8px}p{margin:0 0 16px;color:#a7b1aa}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{font:inherit;color:inherit;background:#242927;border:1px solid #38413b;padding:8px 12px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#314b38;color:#b2d5b6}button:focus-visible{outline:2px solid #b2d5b6;outline-offset:3px}img{display:block;width:100%;height:auto;border:1px solid #38413b}figcaption{margin-top:10px;color:#a7b1aa;font-size:13px}figure{margin:0}a{color:#b2d5b6}
</style></head><body><header><h1>Belfry · 已落地的生产 UI</h1><p>以下是正常生产构建 <code>dist</code> 的实际浏览器截图，不是独立 HTML 原型。测试使用合成原生命令与数据，未启动真实 PTY 或读取用户配置。</p><a href="README.md">变更覆盖与验证记录</a></header><main><nav aria-label="查看生产页面截图"></nav><figure><img id="shot" alt="生产工作台深色截图"><figcaption id="caption"></figcaption></figure></main><script>
const entries=[['工作台 · 深色','workbench-dark-1440x960'],['工作台 · 浅色','workbench-light-1440x960'],['Provider','settings-全局 Provider-dark-1440x960'],['设置 · 外观','settings-外观-light-1440x960'],['插件中心','plugins-installed-permissions'],['协作','collaboration-waiting-result'],['文件 / Git','inspector-git-diff'],['历史会话','history-search-resume'],['用量 · 窄窗','usage-light-820x768'],['项目设置','projects-dark-1024x768'],['SSH · 窄窗','ssh-light-820x768']];
function show(index){document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));const [label,name]=entries[index];document.querySelector('#shot').src=`screenshots/${encodeURIComponent(name)}.png`;document.querySelector('#shot').alt=`${label} · 生产构建实际截图`;document.querySelector('#caption').textContent=`${label}｜来源：src/components/lazy/testing/production-ui.case.mjs｜合成 IPC 数据，不等于原生桌面全平台验收。`;}
entries.forEach(([label],index)=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.onclick=()=>show(index);document.querySelector('nav').append(button);});show(0);
</script></body></html>
