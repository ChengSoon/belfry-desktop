[package]
name = "belfry-desktop"
version = "0.5.1"
description = "Cross-platform AI terminal workspace"
authors = ["appmakes"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "belfry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
ulid = { version = "3.0.0", features = ["serde"] }

# canonicalize 的产物要能直接喂给 CreateProcessW / cmd.exe / 文件对话框，
# 这些都不接受 `\\?\` 前缀，所以 Windows 上换成 dunce 的去前缀版本。
[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
