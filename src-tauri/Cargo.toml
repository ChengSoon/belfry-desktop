[package]
name = "otty-desktop"
version = "0.1.0"
description = "Cross-platform AI terminal workspace"
authors = ["appmakes"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "otty_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
ulid = { version = "3.0.0", features = ["serde"] }
