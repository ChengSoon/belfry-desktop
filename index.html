<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Otty</title>
    <script>
      // 首帧前定主题，避免加载时闪一下另一套配色。
      // 键名与 src/theme/storage.ts 的 THEME_MODE_KEY 一致，改一处要同步改另一处。
      (function () {
        var mode = "dark";
        try {
          var saved = localStorage.getItem("otty.theme.v1");
          mode = saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (error) {
          // 存储不可用时退回暗色
        }
        document.documentElement.dataset.theme = mode;
        document.querySelector('meta[name="theme-color"]').content =
          mode === "light" ? "#fafafa" : "#0a0a0b";

        // macOS 用 Overlay 标题栏（见 src-tauri/tauri.conf.json），webview 铺到窗口顶边，
        // 最上面一条要让给交通灯——由 --titlebar-inset 撑开，见 src/styles.css。
        // 和主题一样必须在首帧前定，否则内容会先贴顶渲染一帧再往下跳。
        // 判平台不用 Tauri 的 os 插件：那是异步的，赶不上首帧。
        if (navigator.userAgent.indexOf("Mac") !== -1) {
          document.documentElement.dataset.platform = "macos";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
