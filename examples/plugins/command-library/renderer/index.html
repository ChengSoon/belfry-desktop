<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>收藏库</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="page-header"><div><h1>收藏库</h1><p id="workspace">读取当前项目…</p></div>
<div class="header-actions"><button id="refresh" class="quiet" type="button">刷新</button><button id="new" class="primary" type="button">＋ 新建</button></div></header>
<p id="notice" class="notice" role="status" hidden></p>
<div class="workspace"><aside><label class="search"><span class="sr-only">搜索收藏</span><input id="search" type="search" placeholder="搜索标题、内容或分类"></label>
<div class="segments filters" role="group" aria-label="筛选收藏类型"><button type="button" data-filter="all" aria-pressed="true">全部</button>
<button type="button" data-filter="prompt" aria-pressed="false">Prompt</button><button type="button" data-filter="command" aria-pressed="false">命令</button></div>
<div class="list-heading"><span id="count">0 项</span><button id="archived" class="quiet" type="button" aria-pressed="false">查看归档</button></div>
<nav id="entries" aria-label="收藏条目"></nav></aside>
<main><div id="empty" class="empty"><span class="empty-mark" aria-hidden="true">＋</span><h2>留住常用的几句话</h2><p>收藏 Prompt 或命令，在需要时预览、编辑并复制。</p></div>
<form id="editor" hidden><fieldset id="fields"><div class="editor-heading"><span id="scope-note" class="eyebrow">新建收藏</span>
<button id="archive-entry" class="quiet" type="button">归档</button></div>
<label class="field"><span>标题</span><input id="title" name="title" maxlength="100" placeholder="例如：审查当前改动" required></label>
<div class="form-row"><div class="field"><span id="kind-label">类型</span><div class="segments" role="group" aria-labelledby="kind-label">
<button type="button" data-kind="prompt" aria-pressed="true">Prompt</button><button type="button" data-kind="command" aria-pressed="false">命令</button></div></div>
<div class="field"><span id="scope-label">保存范围</span><div class="segments" role="group" aria-labelledby="scope-label">
<button type="button" data-scope="project" aria-pressed="true">当前项目</button><button type="button" data-scope="global" aria-pressed="false">全局</button></div></div></div>
<label class="field"><span>分类 <small>可选</small></span><input id="category" name="category" maxlength="60" placeholder="例如研发、文档、Git"></label>
<label class="field"><span>内容</span><textarea id="body" name="body" rows="8" maxlength="16000" spellcheck="false" placeholder="输入常用 Prompt 或命令…" required></textarea></label>
<section class="variables"><button id="toggle-variables" class="quiet" type="button" aria-expanded="false" aria-controls="variable-content">使用项目变量 <span aria-hidden="true">⌄</span></button><div id="variable-content" hidden><p>点击变量插入正文。路径引用方式应与实际 Shell 一致。</p>
<div><button type="button" data-variable="project.name">项目名</button><button type="button" data-variable="project.path">原始路径</button>
<button type="button" data-variable="project.path.posix">POSIX 路径</button><button type="button" data-variable="project.path.powershell">PowerShell 路径</button></div>
<p>例如 <code>cd {{project.path.posix}}</code>；Windows PowerShell 使用 <code>{{project.path.powershell}}</code>。</p></div></section>
</fieldset><div class="editor-actions"><span id="draft-state">已保存</span><button id="cancel" class="quiet" type="button">取消修改</button>
<button id="preview" type="button">预览</button><button id="save" class="primary" type="submit">保存收藏</button></div></form>
<section id="preview-section" class="preview" aria-label="复制前预览" hidden><div><h2>复制前预览</h2><button id="close-preview" class="quiet" type="button">收起</button></div>
<p>变量已填充，可继续编辑。复制后由你粘贴到所需位置。</p><label class="sr-only" for="preview-text">编辑预览内容</label>
<textarea id="preview-text" rows="7" spellcheck="false"></textarea><footer><span>此插件不执行命令</span><button id="copy" class="primary" type="button">复制内容</button></footer></section>
</main></div><script type="module" src="app.js"></script></body></html>
