feature: 2026-08-09-project-agent-workspace-vertical-slice
created: 2026-08-09

steps:
  - action: 结构微重构：拆出终端控制器与 native launch 解析，保持现有单 Shell 行为不变
    exit_signal: 现有前端与 Rust 测试、生产构建通过，Terminal hook 和 PtyBackend 对外契约不变
    status: done

  - action: 项目与 Launcher 名词骨架：建立共享类型、ProjectService 与 Tauri commands
    exit_signal: 当前目录和指定目录可规范化为 ProjectWorkspace，非法目录返回结构化错误
    status: done

  - action: Agent 探测与固定启动节点：实现 Codex/Claude 可用性和安全 Launch Profile
    exit_signal: 已安装工具报告 executable/version 并从项目 cwd 启动，缺失工具返回可观察原因
    status: done

  - action: 工作台静态结构与状态编排：建立项目栏、Launcher、平面标签栏和终端工作面
    exit_signal: 项目、Agent 可用性和多个标签可在静态/模拟状态下完整操作且键盘可达
    status: done

  - action: 多 Session 联调与持久化：接入真实终端、Recent Projects、切项目清理和结构化错误
    exit_signal: 多个真实会话独立运行，标签切换不重建，切项目有界清理，最近项目最多保留 6 条
    status: done

  - action: 验证与视觉收尾：覆盖验收场景、双端构建边界、可访问性和桌面端 smoke
    exit_signal: 定向测试、前端构建、Rust 测试及当前平台桌面视觉/交互证据齐全，Windows 未验证项明确记录
    status: done

