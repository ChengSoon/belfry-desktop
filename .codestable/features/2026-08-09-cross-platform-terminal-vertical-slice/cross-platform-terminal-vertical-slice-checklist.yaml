feature: 2026-08-09-cross-platform-terminal-vertical-slice
created: 2026-08-09

steps:
  - action: 工程与编排骨架：建立共享 UI、Terminal Runtime 和双平台构建入口，跑通空状态流
    exit_signal: macOS 与 Windows 构建入口存在，creating 到 running 到 exited 的 stub 流程可观察
    status: done

  - action: 公共名词与 conformance harness：实现 Session、事件、错误和 PtyBackend 契约
    exit_signal: 同一组契约测试可作用于任意 PtyBackend，参数和错误语义与 design 一致
    status: done

  - action: macOS PTY 节点：接通系统默认 Unix Shell 的创建、输入、缩放和关闭
    exit_signal: macOS 真实终端 smoke 覆盖输入输出、缩放、主动退出和进程清理
    status: done

  - action: Windows PTY 节点：接通系统 powershell.exe 的创建、输入、缩放和关闭
    exit_signal: Windows target 编译通过，ConPTY 路径具备同一 conformance 入口；真实 Windows smoke 留在最终双平台验收
    status: done

  - action: xterm.js 数据流与交互：接通有序输出 Channel、键盘输入和尺寸同步
    exit_signal: macOS 打包应用可见终端连续交互且输出有序，Windows 共享前端与 target 编译通过；Windows 可见交互留在最终验收
    status: done

  - action: 生命周期与错误收口：实现 spawn 失败、退出、重试、超时终止和孤儿进程清理
    exit_signal: 关键失败路径返回约定 AppError，成功 Session 只发一次 exit，关闭后无孤儿 Shell
    status: done

  - action: 双平台验收与性能证据：执行完整 smoke、1 MiB 输出和输入回显测量
    exit_signal: 全部验收场景在 macOS 和 Windows 上有运行证据，或明确记录尚未满足的阻塞
    status: pending

