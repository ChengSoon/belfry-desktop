roadmap: belfry-desktop
created: 2026-08-09

items:
  - slug: cross-platform-terminal-vertical-slice
    description: 同一代码库在 macOS 启动默认 Unix Shell、在 Windows 启动 PowerShell，并完成输入输出、缩放和退出
    depends_on: []
    status: in-progress
    feature: 2026-08-09-cross-platform-terminal-vertical-slice
    minimal_loop: false
    notes: 必须在 macOS 和 Windows 两端通过，单平台成功不算完成

  - slug: project-agent-workspace-vertical-slice
    description: 打开本地项目，检测 Codex 与 Claude Code，并在项目目录启动可切换的 Agent 或 Shell 标签
    depends_on: []
    status: in-progress
    feature: 2026-08-09-project-agent-workspace-vertical-slice
    minimal_loop: true
    notes: 与终端垂直切片并行复用已落地 PTY 契约；进程状态不冒充后续 hooks 生命周期

  - slug: shell-profiles-cross-platform
    description: 检测并启动 macOS zsh、bash、fish 与 Windows PowerShell、CMD、WSL、Git Bash Profile
    depends_on: [cross-platform-terminal-vertical-slice]
    status: planned
    feature: null
    minimal_loop: false
    notes: null

  - slug: terminal-interaction-compatibility
    description: 完成两端 ANSI、Unicode、IME、选择、剪贴板、搜索和链接交互
    depends_on: [cross-platform-terminal-vertical-slice]
    status: in-progress
    feature: 2026-08-10-terminal-interaction-compatibility
    minimal_loop: false
    notes: 2026-08-10 依赖例外——获准在前置 cross-platform-terminal-vertical-slice 仍为 in-progress 时并行开工，因其卡点是缺 Windows 验收证据而非缺实现；例外只覆盖 design 与 implement，本条自身验收仍需 Windows 真机证据。详见主文档观察项。

