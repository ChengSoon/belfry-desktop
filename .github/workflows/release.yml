name: release

# 推 v* tag 触发。workflow_dispatch 留着手动重跑用：
# 某个平台单独挂掉时不必删 tag 重推。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # 一个平台挂掉不该带走其余两个的产物。
      fail-fast: false
      # 三个平台共用同一个 Release；串行可避免并行创建出多个草案。
      max-parallel: 1
      matrix:
        include:
          # Linux 暂不出包：agent/detection.rs 与 terminal/launch.rs 里
          # resolve_default_shell、agent_command 等函数只有 macos / windows
          # 两份 cfg 实现，Linux 下无定义，编译不过。补齐后再加回矩阵。
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # Darwin 双架构只在 macOS runner 上装，省掉另两个平台的无用下载。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 同一 runner 上两个 Darwin 架构的产物不能共用一份缓存。
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Belfry v__VERSION__
          releaseBody: |
            各平台安装包见下方 Assets。本版提供 macOS 与 Windows，暂无 Linux 版。

            macOS 选 `aarch64`（Apple Silicon）或 `x64`（Intel）。
            二进制未做代码签名，首次打开需在「系统设置 → 隐私与安全性」里放行；
            Windows 上 SmartScreen 会提示"未知发布者"，选「更多信息 → 仍要运行」。
          # 先落成草稿：三个平台的产物齐了、人工过一眼再发布。
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
